# FRASIL's build settings (fm1-base's tools/build.py: ./build.sh)
name = "FRASIL"                # the build's files: frasil.fwsc, frasil-X.Y.fwsc
id_prefix = "FM-1_47"          # package identity: dev FM-1_4700, releases FM-1_47XXYYZZ
usb_manufacturer = "FRASIL"
usb_product = "FRASIL FM-1"
ble = false                    # no Bluetooth: its RAM and pool go to the sound
backup = true                  # the scenes and the settings backed up and restored over USB (device/backup.c)
backup_ext = "frasil"          # the backup files: scenes.frasil
backup_holds = "the 16 scenes and the settings"
include = ["../engine", "../engine/dsp"]   # FRASIL's engine (engine/: the sound and the brain, no FM-1)
o2 = ["../engine/dsp/*.c"]     # the DSP at -O2, compiled apart
o2_cflags = ["-DFRS_LEAD=1"]   # with the LEAD, as app.h has it (card #144; the engine's own builds without it)
words = "words.tsv"
gen = ["tools/gen_logo.py assets/frasil-logo.png {gen}/frasil_logo.h 216",   # the logo, 4-bit, for the screen
       "tools/gen_logo.py assets/frasil-logo.png {gen}/frasil_saver.h 112 SAVER"]   # and smaller, the screensaver's
# the site
tagline = "drone textures frozen in motion"
repo = "https://github.com/styvesgoupil/frasil"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
# firmware.json, for the firmware hubs (fm1-base docs/FIRMWARE-JSON.md: a --release build refuses without them); the
# text is fmhub.json's
author = "Styves Goupil"
description = "An ambient drone instrument: tap a key to latch a drone, a note or a chord in your key. Three layers a voice into a big reverb with shimmer and freeze; GLINT's icy FM bells on top, by hand, arpeggio or sequence; BASS a deep line below, held or sequenced; three LFOs keep it all moving."
tags = ["synth", "ambient", "chords"]
install = "https://thefirmwarehub.com/#fw-frasil"
site = "https://frasilsynth.com"
screenshot = "docs/img/screen-play.png"
# the SMK-37's builds (FM1B_BOARD=smk37 FM1B_MODEL=elite | pro | mke, card #111): KEY_smk37 is KEY there, never on the
# FM-1. Its three models are one keyboard, each package under its own model's identity
id_prefix_smk37 = "FM-1_4"     # its identity: "SMK-37 Elite_" leaves 7 of the 20 characters: dev SMK-37 Elite_400,
                               # releases SMK-37 Elite_4XXYYZZ (3.3.1: SMK-37 Elite_4030301), SMK-37 Pro_4XXYYZZ,
                               # MKE-P37_4XXYYZZ
pool_spare_smk37 = 8032        # its pool's spare: the pads' LED frame (636 B) is the SMK's, 160 B under fm1-base's 8192
install_smk37 = "https://frasilsynth.com/guide/install/?device=smk37"   # back up first, then install (no Hub installer)
screenshot_smk37 = "app/docs/img/smk37/screen-play.png"
