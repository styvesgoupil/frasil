# FRASIL's website: the settings that change between releases live here, and only here.
# tools/website.sh reads this file and assembles the site into build/website/frasil/.

# ---------------------------------------------------------------- the release status (change these two)
# Shown at the top right of the landing (where the FM-1's logo screen shows its version), in the footer, on the
# install sections, and in the guide's Install page.
status = "2.6 · out now"
# One or two sentences, plain text, shown next to the install instructions.
beta_note = "Installing is at your own risk; the installer can always put M-VAVE's own firmware back."

# ---------------------------------------------------------------- where the site lives
site_url = "https://frasilsynth.com/"       # absolute: Open Graph and canonical links only
base_path = "/"                             # where the site is served (the 404 page's <base>): its own domain's root
repo = "https://github.com/styvesgoupil/frasil"
releases = "https://github.com/styvesgoupil/frasil/releases/latest"
hub = "https://thefirmwarehub.com/#fw-frasil"
river_url = "https://river.frasilsynth.com/"   # the River: back up the FM-1's scenes, put shards back (its own site)
perform_url = "https://perform.frasilsynth.com/"   # Perform: the FM-1's play full screen (its own site, build/website/perform)
# FRASIL's Discord server, Frasil Synth: a permanent invite, in both sites' headers and the footer (empty: no link)
discord = "https://discord.gg/Bvr5crkY9A"

