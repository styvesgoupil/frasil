<div class="rvh-band">
<canvas class="rvh-water" aria-hidden="true"></canvas>
<header class="rvh">
  <a class="rvh-mark" href="/" aria-label="FRASIL River: the community shard library">
    <!-- the block: FRASIL's letters 150 wide (their waterline at 20, the blade past them), RIVER spread to the same
         width; under them the tagline, on one line, as long as it is -->
    <svg class="rvh-logo" viewBox="0 0 150 64" width="150" height="64" aria-hidden="true" focusable="false">
      <image href="/assets/img/logo-duo.png" x="-10.93" y="3.68" width="172.12" height="34.94"/>
      <text class="rvh-river" x="2" y="62" textLength="146" lengthAdjust="spacing">RIVER</text>
    </svg>
    <span class="rvh-tag" aria-hidden="true">Community shard library</span>
  </a>
  <nav class="rvh-nav" aria-label="FRASIL River">
    <a class="p-yours" href="/yours/"{{cur_yours}}><span class="nav-long">Your </span>Private<span class="nav-long"> River</span></a>
    <a class="p-nav" href="/"{{cur_community}}>Community<span class="nav-long"> River</span></a>
    <a class="p-tools" href="/tools/"{{cur_tools}}>Tools</a>
    <a class="rvh-who" href="/yours/#signin" data-who{{cur_profile}}>Sign in</a>
  </nav>
  <script>   /* who was signed in here last (river-api.js keeps it): the name at once, not Sign in for a moment */
    try { const n = localStorage.getItem("river-me"), a = document.querySelector(".rvh [data-who]");
      if (n && a) { a.textContent = n; a.href = "/profile/"; a.classList.add("is-in"); a.setAttribute("aria-label", "Your profile: signed in as " + n); } } catch (_) {}
  </script>
</header>
</div>
